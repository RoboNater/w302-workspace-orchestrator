# Sample project context — edit paths to match your machine
# This is what deploy.ps1 reads to set up your workspace.

meta:
  name: "workspace-orchestrator"
  description: "Use the workspace-orchestrator to work on itself"

virtual_desktops:
  primary: 1

applications:
  vscode:
    type: "vscode"
    workspace: "C:/dev/workspace-orchestrator"  
    window:
      monitor: 0
      position: { x: 0, y: 0, width: 960, height: 1040 }

  terminals:
    type: "windows-terminal"
    window:
      monitor: 0
      position: { x: 960, y: 0, width: 960, height: 520 }
    tabs:
      - title: "wrk-orch"
        directory: "C:/dev/workspace-orchestrator"  
        shell: "pwsh"
      - title: "git-ops"
        directory: "C:/dev/workspace-orchestrator"
        shell: "bash"

  explorer:
    type: "file-explorer"
    paths:
      - "C:/dev/workspace-orchestrator" 
    window:
      monitor: 0
      position: { x: 960, y: 520, width: 960, height: 520 }
