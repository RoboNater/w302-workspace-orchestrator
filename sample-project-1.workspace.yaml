# Sample Project 1 — Data Processor (schema v2)
version: 2
meta:
  name: "sample-project-1"
  description: "Data processing utility - CSV analysis and statistics"

virtual_desktops:
  primary: 2

hotkey: "Ctrl+Alt+1"

applications:
  vscode:
    type: "vscode"
    workspace: "C:/dev/workspace-orchestrator/sample-projects/sample-project-1"
    window:
      monitor: 0
      position: { x: 0, y: 0, width: 960, height: 1040 }

  terminals:
    type: "windows-terminal"
    window:
      monitor: 0
      position: { x: 960, y: 0, width: 960, height: 520 }
    tabs:
      - title: "Project"
        directory: "C:/dev/workspace-orchestrator/sample-projects/sample-project-1"
        shell: "pwsh"
      - title: "Scratch"
        directory: "C:/Users/AgentUser01"
        shell: "pwsh"

  explorer:
    type: "file-explorer"
    paths:
      - "C:/dev/workspace-orchestrator/sample-projects/sample-project-1"
    window:
      monitor: 0
      position: { x: 960, y: 520, width: 960, height: 520 }

  browser:
    type: "chrome"
    profile: "sample-project-1"
    urls:
      - "http://localhost:3000"
      - "https://github.com"
    window:
      monitor: 0
      position: { x: 0, y: 0, width: 1920, height: 1080 }
