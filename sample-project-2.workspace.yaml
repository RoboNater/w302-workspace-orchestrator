# Sample Project 2 — Web Server (schema v2)
version: 2
meta:
  name: "sample-project-2"
  description: "Lightweight HTTP server for development and testing"

virtual_desktops:
  primary: 3

hotkey: "Ctrl+Alt+2"

applications:
  vscode:
    type: "vscode"
    workspace: "C:/dev/workspace-orchestrator/sample-projects/sample-project-2"
    window:
      monitor: 0
      position: { x: 0, y: 0, width: 960, height: 1040 }

  terminals:
    type: "windows-terminal"
    window:
      monitor: 0
      position: { x: 960, y: 0, width: 960, height: 520 }
    tabs:
      - title: "Server"
        directory: "C:/dev/workspace-orchestrator/sample-projects/sample-project-2"
        shell: "pwsh"
        run_on_deploy: "echo 'Starting dev server...'"
      - title: "Test"
        directory: "C:/dev/workspace-orchestrator/sample-projects/sample-project-2"
        shell: "pwsh"

  explorer:
    type: "file-explorer"
    paths:
      - "C:/dev/workspace-orchestrator/sample-projects/sample-project-2"
    window:
      monitor: 0
      position: { x: 960, y: 520, width: 960, height: 520 }

  browser:
    type: "edge"
    profile: "sample-project-2"
    urls:
      - "http://localhost:8080"
      - "https://github.com"
    window:
      monitor: 0
      position: { x: 0, y: 0, width: 1920, height: 1080 }
